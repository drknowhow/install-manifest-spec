name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  schema:
    name: Schema (validator-checked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema check-jsonschema
      - name: Meta-validate every schema (Draft 2020-12)
        run: |
          python - <<'PY'
          import json, glob
          from jsonschema import Draft202012Validator
          schemas = sorted(
              glob.glob("schema/install-manifest-v*.json")
              + glob.glob("schema/well-known-index-v*.json")
          )
          assert schemas, "no schemas found in schema/"
          for path in schemas:
              schema = json.load(open(path))
              Draft202012Validator.check_schema(schema)
              print(f"meta-valid: {path}")
          PY
      - name: Validate every example against its declared schema
        run: |
          python - <<'PY'
          import json, glob, os, subprocess, sys
          ok = True
          for path in sorted(glob.glob("examples/*.json")):
              manifest = json.load(open(path))
              # Two example shapes are recognized:
              #   1. install-manifest: top-level "manifest_version" → versioned manifest schema
              #   2. well-known-index: top-level "version" + "publisher" + "manifests" → index schema
              if "manifest_version" in manifest:
                  version = manifest["manifest_version"]
                  schema_path = f"schema/install-manifest-v{version}.json"
              elif all(k in manifest for k in ("version", "publisher", "manifests")):
                  version = manifest["version"]
                  schema_path = f"schema/well-known-index-v{version}.json"
              else:
                  print(f"FAIL {path}: not a recognized example shape "
                        f"(needs 'manifest_version', or 'version'+'publisher'+'manifests')")
                  ok = False
                  continue
              if not os.path.isfile(schema_path):
                  print(f"FAIL {path}: declares v{version} but no schema at {schema_path}")
                  ok = False
                  continue
              print(f"checking {path} against {schema_path}")
              r = subprocess.run(
                  ["check-jsonschema", "--schemafile", schema_path, path],
                  capture_output=True, text=True,
              )
              sys.stdout.write(r.stdout)
              sys.stderr.write(r.stderr)
              if r.returncode != 0:
                  ok = False
          sys.exit(0 if ok else 1)
          PY

  cli:
    name: CLI tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CLI in editable mode with test extras
        working-directory: cli
        run: |
          pip install --upgrade pip
          pip install -e ".[test]"
      - name: Pytest
        working-directory: cli
        run: pytest -q

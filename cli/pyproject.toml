[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "install-manifest"
version = "0.2.0"
description = "Reference CLI for the install-manifest spec — fetch, validate, and preview install manifests. Supports manifest_version 0.1 and 0.2."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Dimitri Tselenchuk" }
]
keywords = ["install-manifest", "mcp", "agent", "tooling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=7,<9",
]

[project.scripts]
install-manifest = "install_manifest.__main__:main"

[project.urls]
Homepage = "https://github.com/drknowhow/install-manifest-spec"
Issues = "https://github.com/drknowhow/install-manifest-spec/issues"

[tool.setuptools]
packages = ["install_manifest"]

[tool.setuptools.package-data]
install_manifest = ["_data/*.json"]
